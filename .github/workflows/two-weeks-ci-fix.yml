name: Apply Two Weeks CI compatibility fixes

on:
  push:
    branches: [codex/two-weeks-markdown-no-database]
    paths: ['.github/workflows/two-weeks-ci-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'ban12-project/ban12-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/two-weeks-markdown-no-database
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Apply narrow fixes without changing validation semantics
        shell: python
        run: |
          from pathlib import Path
          app = Path('apps/two-weeks-in-china')
          replacements = {
            'scripts/content/export.ts': [
              ('const env: NodeJS.ProcessEnv = { ...inherited, PGHOST:',
               "const env: NodeJS.ProcessEnv = { ...inherited, NODE_ENV: process.env.NODE_ENV ?? 'production', PGHOST:")
            ],
            'tests/content.test.ts': [
              ("const env = { PATH: root, CONTENT_DATABASE_URL:",
               "const env: NodeJS.ProcessEnv = { NODE_ENV: 'test', PATH: root, CONTENT_DATABASE_URL:"),
              ("{ env: { PATH: setup.root }, encoding: 'utf8' }",
               "{ env: { NODE_ENV: 'test', PATH: setup.root }, encoding: 'utf8' }"),
              ("'/en/a#b', '/en/a b',", "'/en/a#b', '/en/a b', '/en/a\\n', '/en/a\\u0000',")
            ],
            'lib/content/core.ts': [
              (r"path.startsWith('/') && !/[\\%?#\x00-\x20]/.test(path)",
               r"path.startsWith('/') && !/[\\%?#]/.test(path) && !Array.from(path).some((character) => character.charCodeAt(0) <= 32)")
            ]
          }
          changes = {}
          for name, edits in replacements.items():
            path = app / name
            content = path.read_text()
            for old, new in edits:
              if content.count(old) != 1:
                raise ValueError(f'Unexpected source baseline: {name}')
              content = content.replace(old, new)
            changes[path] = content
          for path, content in changes.items():
            path.write_text(content)
      - run: pnpm install --frozen-lockfile
      - name: Format and lint the target app
        run: pnpm --filter two-weeks-in-china lint
      - name: Run content tests with project-pinned TypeScript
        run: pnpm --filter two-weeks-in-china test:content
      - name: Check the complete Next.js application types
        run: pnpm --filter two-weeks-in-china type-check
      - name: Commit verified fixes only to the PR branch
        run: |
          git diff --check
          git add -- apps/two-weeks-in-china
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(two-weeks-in-china): satisfy Next.js environment types and content lint'
          git push origin HEAD:refs/heads/codex/two-weeks-markdown-no-database
