name: Prepare Two Weeks Markdown migration

on:
  push:
    branches: [codex/two-weeks-markdown-no-database]
    paths:
      - 'apps/two-weeks-in-china/lib/content/core.ts'
      - '.github/scripts/prepare-two-weeks-markdown.py'

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'ban12-project/ban12-site'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/two-weeks-markdown-no-database
          fetch-depth: 0
      - name: Apply scoped dependency and import changes
        run: python .github/scripts/prepare-two-weeks-markdown.py
      - name: Commit only migration changes to the preparation branch
        run: |
          git diff --check
          git add -- apps/two-weeks-in-china pnpm-lock.yaml turbo.json AGENTS.md
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(two-weeks-in-china): remove database wiring and dependencies'
          git push origin HEAD:refs/heads/codex/two-weeks-markdown-no-database
